[theme]
base = "dark"
primaryColor = "#2E5BFF"
backgroundColor = "#090B10"
secondaryBackgroundColor = "#111722"
textColor = "#F4F4F5"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
